# GitHub Actions workflow for building, testing, verifying, and publishing plugin releases:
# - Build the plugin ZIP with the 'buildPlugin' task and upload it as a workflow artifact.
# - Run the 'check' task and upload test reports on failure.
# - Run the 'verifyPlugin' task and upload Plugin Verifier reports.
# - Publish version-tagged releases to JetBrains Marketplace and GitHub Releases.
#
# The workflow is triggered on pushes to the 'main' branch, version tags, and pull_request events.
#
# GitHub Actions reference: https://docs.github.com/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
    tags:
      - '*.*.*'
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:

  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./gradlew buildPlugin -Pversion="${RELEASE_VERSION#v}"
          else
            ./gradlew buildPlugin
          fi

      # Store an already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  # Run tests and upload test reports on failure
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./gradlew check -Pversion="${RELEASE_VERSION#v}"
          else
            ./gradlew check
          fi

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./gradlew verifyPlugin -Pversion="${RELEASE_VERSION#v}"
          else
            ./gradlew verifyPlugin
          fi

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Publish the plugin to JetBrains Marketplace and create a GitHub Release
  publish:
    name: Publish Plugin
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ build, test, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Validate release tag
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]]; then
            echo "::error::지원하지 않는 버전 태그입니다: $RELEASE_VERSION"
            echo "::error::stable은 X.Y.Z, beta는 X.Y.Z-beta 형식을 사용하세요."
            exit 1
          fi

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -Pversion="${RELEASE_VERSION#v}"

      # Create a GitHub Release and upload distribution assets
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_VERSION"
          VERSION="${TAG#v}"
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$RELEASE_NOTE" \
            "${RELEASE_FLAGS[@]}" \
            ./build/distributions/*
